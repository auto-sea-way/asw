name: CI Check

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Generate Kotlin bindings
        run: crates/asw-mobile/scripts/gen-bindings.sh debug kotlin target/uniffi/kotlin

      - name: Compile Kotlin bindings
        run: |
          curl -sSL -o /tmp/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
          command -v kotlinc >/dev/null || sudo snap install --classic kotlin
          kotlinc -cp /tmp/jna.jar -d /tmp/kt-out $(find target/uniffi/kotlin -name '*.kt')

      - name: License and advisory check
        uses: EmbarkStudios/cargo-deny-action@v2
